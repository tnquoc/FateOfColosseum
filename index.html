const ctx = canvas.getContext('2d');

let noiseBuf = null;

}

const BTN = { choiceA: [330, 420, 300, 64], choiceD: [650, 420, 300, 64], restart: [490, 430, 300, 56], retry: [490, 380, 300, 64], replay: [490, 590, 300, 64], tha: [330, 430, 260, 72], giet: [690, 430, 260, 72] };
const inBtn = (p, b) => p.x >= b[0] && p.x <= b[0] + b[2] && p.y >= b[1] && p.y <= b[1] + b[3];
/** A click or tap on a HUD control; true when it was one. */
function uiClick(p) {
  if (p.y < 50 && p.x > 1136 && p.x < 1184) { toggleView(); return true; }
  if (p.x > 1186 && p.y < 50) { if (p.x < 1228) { if (scene === 'play') scene = 'pause'; else if (scene === 'pause') scene = 'play'; } else setMuted(!muted); return true; }
  if (scene === 'pause') { if (inBtn(p, BTN.restart)) restartRun(); else scene = 'play'; return true; }
  if (scene === 'cut' && cut) {
    const b = cut.beats[cut.i], asks = b.choice && cut.shown >= b.text.length;
    if (inBtn(p, CUT_SKIP)) endCut(); else if (asks && inBtn(p, BTN.choiceA)) cutPick('a'); else if (asks && inBtn(p, BTN.choiceD)) cutPick('d'); else cutTap();
    return true;

  if (scene === 'results') { if (inBtn(p, BTN.replay)) resultsGo(); return true; }
  if (scene === 'mercy' && state.mercy && state.mercy.mode === 'choose' && !state.mercy.choice) {
    if (inBtn(p, BTN.tha)) decideMercy('tha'); else if (inBtn(p, BTN.giet)) decideMercy('giet');
    return true;

function retry() { setupFight(state.fight, false); scene = 'play'; }

// ---- Scenes ---------------------------------------------------------------------------------
// No title screen: the game opens straight into the fight (the brief's Avoid), the title is a

// results: the end. figures: every fighter side by side, for the outline check (?scene=figures).
function drawWorld(a) { sync(a); render3d(); ctx.clearRect(0, 0, W, H); }
const scenes = {
  figures: {
    update(dt) { vt += dt; },

        if (M.mode === 'choose') {
          textO(`Danh Vọng ${Math.round(state.fame)} ≥ ${tune.fame_choose}: quyền phán quyết là của Kael`, W / 2, 222, 22, '#F2C94C');
          button(...BTN.tha, isTouch ? 'THA' : 'THA (A)', false); button(...BTN.giet, isTouch ? 'GIẾT' : 'GIẾT (D)', false);
          thumb(460, 380, true, 0.8); thumb(820, 390, false, 0.8);
        } else {

          const wob = Math.sin(vt * 10) * 0.5 + 0.5; thumb(W / 2, 400, wob > 0.5, 1);

        textO(M.vote ? (tha ? 'Đám đông giơ ngón cái: tha cho nó.' : 'Đám đông chúc ngón cái: giết!') : (tha ? 'Kael hạ kiếm.' : 'Kael ra tay.'), W / 2, 222, 22, '#E9DFC8');

        row([
          ['Nghĩa · Huyết', `${s.nghia} · ${s.huyet}`, s.nghia >= s.huyet ? '#BFD8C0' : '#E9B8A8'],

/** One step of the world: hit-stop freezes the fighters, a parry slows time for a beat. */
function advance(dt) {
  vt += dt;
  let sim = dt;
  if (hitstop > 0) { hitstop -= dt; sim = 0; }
  else if (slowT > 0) { slowT -= dt; sim = dt * tune.parry_slow; }
  shake = Math.max(0, shake - dt * 1.6);
  stepWorld(sim, dt);
  updateParts(sim > 0 ? sim : dt * 0.2);
  updateSpellFx(sim > 0 ? sim : dt * 0.2);
  for (let i = FX.pops.length - 1; i >= 0; i--) { FX.pops[i].t += dt; if (FX.pops[i].t > 1.4) FX.pops.splice(i, 1); }
  updateCrowd(dt, vt);
  updateCamera(dt);
}

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  updateDrums();
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  if (pressed('KeyV')) { toggleView(); hit.delete('KeyV'); }
  scenes[scene].update(STEP); hit.clear();
  fadeA += clamp(fadeTo - fadeA, -STEP * 2.2, STEP * 2.2);
  if (events.length > 300) events.splice(0, events.length - 300);
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP; // draw between steps, so the view never judders
  drawFrame();
}
let fadeA = 0, fadeTo = 0; // black between fights: out after a win, in as the next one opens
function drawFrame() {
  scenes[scene].draw();
  if (fadeA > 0.01) { ctx.fillStyle = `rgba(0,0,0,${Math.min(1, fadeA)})`; ctx.fillRect(0, 0, W, H); }
}
function frame() { tick(); requestAnimationFrame(frame); }
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; }, // the loop steps; a check empties it
  skipCut() { endCut(); },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

// ---- Start: the models parse first (a moment), then the arena and the run -------------------
const figureLineup = [], figSet = clamp(Number(params.get('set')) || 1, 1, 3);
function boot() {

Object.assign(brennus, { x: brennusSpot.x, y: STAND_Y, z: brennusSpot.z, px: brennusSpot.x, pz: brennusSpot.z, state: 'idle' });
for (const p of [brennusSpot, varroSpot]) scene3.add(at(box(1.2, STAND_Y, 1.2, mat(0x988D76)), p.x, STAND_Y / 2, p.z));
for (const w of ['varro', 'herald', 'emperor', 'sabina', 'lyra']) extras[w] = newFighter(w);

if (scene === 'results') { // a check view of an end screen: ?scene=results&ch=2, or &ending=tudo|khoinghia|vua
  const en = params.get('ending'); state.resultT = 9;
  if (en) { Object.assign(state, { purse: 5180, varroTotal: 7770, nghia: 4, huyet: 1, lyra: en === 'tudo', parries: 96, deaths: 7 }); state.result = { mode: 'ending', kind: ENDINGS[en] ? en : 'tudo' }; }
  else { const ch = clamp(Number(params.get('ch')) || 1, 1, 3); Object.assign(state, { fight: [9, 24, 44][ch - 1], purse: [104, 1280, 3460][ch - 1], parries: 12 * ch, demandsMet: 2 * ch - 2, nghia: ch, huyet: 1 }); state.result = { mode: 'chapter', ch, gross: [260, 2950, 5450][ch - 1], varro: [156, 1770, 3270][ch - 1] }; }
}
if (!params.get('scene') && tune.start_fight <= 1 && params.get('fresh') !== '1') loadRun(); // a reload goes on from the fight reached
if (tune.start_fight > 1 && (scene === 'play' || scene === 'cut')) { state.learned = learnedBefore(Math.round(tune.start_fight) - 1); tutorialDone = true; state.titleT = 0; cut = null; scene = 'play'; setupFight(clamp(Math.round(tune.start_fight), 1, FIGHTS.length) - 1, true); } // start later in the ladder (testing)
if (scene === 'figures') { // every fighter in a row, named
  fadeA = fadeTo = 0;
  state.foes.forEach(removeFighter); state.foes = []; state.enemy = null; FIG.get(brennus).root.visible = false;
  for (const w in extras) FIG.get(extras[w]).root.visible = false;
  const set = [['kael', 'recruit', 'shield', 'net', 'grull', 'dual', 'lion', 'brennus', 'varro', 'herald', 'emperor'],
    ['axe', 'spear', 'archer', 'guard', 'praetor', 'sabina', 'twinA', 'twinB', 'admiral', 'mentor', 'golden', 'lyra'], ['lion', 'elephant', 'chariot']][figSet - 1];
  if (figSet > 1) { removeFighter(state.kael); setPillars(false); }
  set.forEach((kind, i) => {
    const f = kind === 'kael' ? state.kael : newFighter(kind), x = figSet === 3 ? -6 + i * 6 : -10 + i * (figSet === 2 ? 1.8 : 2.0), z = figSet === 1 && kind === 'lion' ? -0.6 : 0;
    Object.assign(f, { x, z, px: x, pz: z, yaw: figSet === 3 ? 0.9 : 0.35, state: 'idle' });
    figureLineup.push(f);
  });
}
updateCamera(1);
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
window.game.ready = true;
}
loadModels(boot);
