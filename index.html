'use strict';

// ---- Built to be checked ----------------------------------------------------------------

const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap'; // a headless shot or check: 3D draws cheap; players never see it
let seed;

const events = []; // window.game.events: anything the game wants a run to see

// ---- Screen: the 3D view under, the HUD canvas over -----------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const renderer = new THREE.WebGLRenderer({ antialias: !CHEAP, powerPreference: 'high-performance' });

document.body.insertBefore(renderer.domElement, canvas);
let viewS = 1, viewL = 0, viewT = 0;

addEventListener('resize', fit); fit();

// ---- Input: keys by position (event.code), OS key repeat ignored ------------------------

addEventListener('blur', () => down.clear());
addEventListener('contextmenu', e => e.preventDefault());
let isTouch = false;
const joy = { id: null, ox: 0, oy: 0, x: 0, y: 0 };
const touchCodes = new Map(); // pointerId -> code held by a touch button
function toLogical(e) { return { x: (e.clientX - viewL) / viewS, y: (e.clientY - viewT) / viewS }; }
const TB = { // touch buttons, logical coordinates
  atk: { x: 1150, y: 600, r: 70, code: 'KeyJ' },
  blk: { x: 1000, y: 648, r: 52, code: 'KeyK' },
  roll: { x: 1176, y: 448, r: 50, code: 'Space' },
  div: { x: 1036, y: 518, r: 46, code: 'KeyQ' },

canvas.addEventListener('pointerdown', e => {

  if (e.pointerType === 'touch' || e.pointerType === 'pen') isTouch = true;
  if (uiClick(p)) return;
  if (scene !== 'play') return;

    for (const b of Object.values(TB)) {

    }
    if (p.x < W * 0.5 && joy.id === null) { joy.id = e.pointerId; joy.ox = p.x; joy.oy = p.y; joy.x = joy.y = 0; }
    return;
  }

canvas.addEventListener('pointermove', e => {
  if (e.pointerId !== joy.id) return;
  const p = toLogical(e), dx = p.x - joy.ox, dy = p.y - joy.oy, l = Math.hypot(dx, dy), R = 70;
  joy.x = l > 8 ? dx / Math.max(l, R) : 0; joy.y = l > 8 ? dy / Math.max(l, R) : 0;

// ---- Audio: started on first input, mute on M --------------------------------------------

// looped as a bed that opens up with the crowd's mood, and replayed in swells for each roar.

    out.connect(comp); comp.connect(ac.destination);

    const hlp = new BiquadFilterNode(ac, { type: 'lowpass', frequency: 2200, Q: 0 }), wet = new GainNode(ac, { gain: 0.55 });
    hall.connect(dl); dl.connect(hlp); hlp.connect(fb); fb.connect(dl); hlp.connect(wet); wet.connect(out);

addEventListener('tune', () => setMuted(muted)); // the tweak panel (an add-on), when added, moved a value: the volume follows
let noiseBuf = null;
function getNoise() {

    const ac = audio.ac, n = ac.sampleRate * 2; noiseBuf = ac.createBuffer(1, n, ac.sampleRate);

}

if (scene === 'results') { // a check view of an end screen: ?scene=results&ch=2, or &ending=tudo|khoinghia|vua
  const en = params.get('ending'); state.resultT = 9;
  if (en) { Object.assign(state, { purse: 5180, varroTotal: 7770, nghia: 4, huyet: 1, lyra: en === 'tudo', parries: 96, deaths: 7 }); state.result = { mode: 'ending', kind: ENDINGS[en] ? en : 'tudo' }; }
  else { const ch = clamp(Number(params.get('ch')) || 1, 1, 4); Object.assign(state, { fight: [5, 11, 17, 23][ch - 1], purse: [104, 900, 1900, 3300][ch - 1], parries: 12 * ch, demandsMet: 2 * ch - 2, nghia: ch, huyet: 1 }); state.result = { mode: 'chapter', ch, gross: [260, 2250, 3800, 6200][ch - 1], varro: [156, 1350, 2280, 3720][ch - 1] }; }
}
if (!params.get('scene') && tune.start_fight <= 1 && params.get('fresh') !== '1') loadRun(); // a reload goes on from the fight reached
if (tune.start_fight > 1 && (scene === 'play' || scene === 'cut')) { state.learned = learnedBefore(Math.round(tune.start_fight) - 1); tutorialDone = true; state.titleT = 0; cut = null; scene = 'play'; setupFight(clamp(Math.round(tune.start_fight), 1, FIGHTS.length) - 1, true); } // start later in the ladder (testing)
if (DEBUG && Number(params.get('fight')) >= 1 && (scene === 'play' || scene === 'cut')) debugJump(Math.round(Number(params.get('fight'))) - 1);
if (scene === 'figures') { // every fighter in a row, named
  fadeA = fadeTo = 0;
  state.foes.forEach(removeFighter); state.foes = []; state.enemy = null; FIG.get(brennus).root.visible = false;
  for (const w in extras) FIG.get(extras[w]).root.visible = false;
  const set = [['kael', 'recruit', 'shield', 'net', 'grull', 'dual', 'lion', 'brennus', 'varro', 'herald', 'emperor'],
    ['axe', 'spear', 'archer', 'guard', 'praetor', 'sabina', 'twinA', 'twinB', 'admiral', 'mentor', 'golden', 'lyra'], ['lion', 'elephant', 'chariot']][figSet - 1];
  if (figSet > 1) { removeFighter(state.kael); setPillars(false); }
  set.forEach((kind, i) => {
    const f = kind === 'kael' ? state.kael : newFighter(kind), x = figSet === 3 ? -6 + i * 6 : -10 + i * (figSet === 2 ? 1.8 : 2.0), z = figSet === 1 && kind === 'lion' ? -0.6 : 0;
    Object.assign(f, { x, z, px: x, pz: z, yaw: figSet === 3 ? 0.9 : 0.35, state: 'idle' });
    figureLineup.push(f);
  });
}
updateCamera(1);
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
window.game.ready = true;
}
loadModels(boot);
</script>
